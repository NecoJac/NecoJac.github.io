name: Check website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test personal-file handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare public files
        run: python scripts/build_site.py
      - name: Check links and original videos
        run: python scripts/check_assets.py --root _site
